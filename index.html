<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 15px;
        }

        .user-message {
            background-color: #272727;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: #1e1f20;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }

        .speak-btn {
            background: none;
            border: none;
            color: #8e8e93;
            cursor: pointer;
            margin-top: 8px;
            font-size: 13px;
            display: inline-block;
        }

        .speak-btn:hover {
            color: #fff;
        }

        #loading {
            display: none;
            color: #8e8e93;
            font-style: italic;
            margin-left: 20px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #input-container {
            padding: 12px 20px;
            background-color: #1e1f20;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 30px;
            margin: 15px 20px 20px 20px;
            border: 1px solid #333;
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            padding: 5px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #c4c7c5;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>
    <div id="loading">AI soch raha hai...</div>

    <div id="input-container">
        <button class="icon-btn" onclick="startVoiceInput()" title="Boliye (Mic)">🎤</button>
        <input type="text" id="user-input" placeholder="Kuch bhi puchhein..." onkeypress="handleKeyPress(event)">
        <button class="icon-btn" onclick="sendMessage()" title="Bhejein (Arrow)">➔</button>
    </div>

    <script>
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const loading = document.getElementById("loading");

        function appendMessage(sender, text) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender === "User" ? "user-message" : "ai-message");
            msgDiv.innerText = text;

            if (sender === "AI") {
                const speakBtn = document.createElement("button");
                speakBtn.classList.add("speak-btn");
                speakBtn.innerText = "🔊 Suno";
                speakBtn.onclick = () => speakText(text);
                msgDiv.appendChild(document.createElement("br"));
                msgDiv.appendChild(speakBtn);
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage("User", text);
            userInput.value = "";
            loading.style.display = "block";

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                loading.style.display = "none";
                appendMessage("AI", data.response);
            } catch (err) {
                loading.style.display = "none";
                appendMessage("AI", "Error: Server connect nahi ho pa raha hai.");
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }

        // Voice to Text Feature
        function startVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Aapka browser voice input support nahi karta.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
            };
            recognition.start();
        }

        // Text to Speech Feature
        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
