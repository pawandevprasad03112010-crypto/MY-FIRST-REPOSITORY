<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Search Engine</title>
    <style>
        :root {
            --bg-purple: #140728;
            --card-purple: #250f44;
            --box-purple: #35175e;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --silver-light: #e6e6e6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-purple);
            color: var(--silver-light);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(37, 15, 68, 0.9);
            border-bottom: 2px solid var(--gold);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            color: var(--gold);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .logout-btn {
            color: var(--gold);
            text-decoration: none;
            border: 1px solid var(--gold);
            padding: 6px 15px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: var(--gold);
            color: var(--bg-purple);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            background: rgba(37, 15, 68, 0.8);
            border: 2px solid var(--gold);
            border-radius: 30px;
            color: #fff;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
            box-sizing: border-box;
            transition: 0.3s;
        }

        .search-box:focus {
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        }

        .suggestions-dropdown {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            background: var(--card-purple);
            border: 1px solid var(--gold);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(192, 192, 192, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suggestion-item:hover {
            background: var(--box-purple);
            color: var(--gold);
        }

        .result-card {
            display: none;
            background: var(--card-purple);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Side-Scroll Image Carousel */
        .carousel-container {
            position: relative;
            max-width: 100%;
            height: 380px;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--silver);
            background: #000;
            display: none;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-image {
            min-width: 100%;
            height: 100%;
            object-fit: contain;
            flex-shrink: 0;
            background: #000;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(20, 7, 40, 0.7);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        /* Dynamic Grid Layout for Document Details */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-box {
            background: var(--box-purple);
            border: 1px solid var(--silver);
            padding: 15px;
            border-radius: 10px;
            word-break: break-word;
        }

        .box-title {
            color: var(--gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .box-value {
            color: var(--silver-light);
            font-size: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">👑 Royal Search</div>
        <div>
            Welcome, <b>{{ user }}</b> &nbsp;|&nbsp;
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-box" placeholder="Type single alphabet, word, or sentence..." autocomplete="off">
            <div id="suggestions" class="suggestions-dropdown"></div>
        </div>

        <div id="resultCard" class="result-card">
            
            <!-- Side Scrollable Carousel for Multi-Images -->
            <div class="carousel-container" id="carouselContainer">
                <button class="nav-btn prev-btn" onclick="scrollCarousel(-1)">&#10094;</button>
                <div class="carousel-track" id="carouselTrack"></div>
                <button class="nav-btn next-btn" onclick="scrollCarousel(1)">&#10095;</button>
            </div>

            <!-- Dynamic Information Boxes Grid -->
            <div class="details-grid" id="detailsGrid"></div>

        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const suggestionsDiv = document.getElementById('suggestions');
        const resultCard = document.getElementById('resultCard');
        const carouselContainer = document.getElementById('carouselContainer');
        const carouselTrack = document.getElementById('carouselTrack');
        const detailsGrid = document.getElementById('detailsGrid');

        // Real-Time Search Event Listener
        searchInput.addEventListener('input', async function() {
            const query = this.value.trim();

            if (query.length === 0) {
                suggestionsDiv.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const items = await res.json();

                suggestionsDiv.innerHTML = '';

                if (items.length === 0) {
                    suggestionsDiv.innerHTML = '<div class="suggestion-item">No matches found</div>';
                } else {
                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        
                        // Main Display Title Key select karna
                        const titleText = item.title || item.name || item.subject || Object.values(item)[0] || "Result";
                        div.innerHTML = `<span>${titleText}</span>`;
                        
                        div.onclick = () => renderResultCard(item, titleText);
                        suggestionsDiv.appendChild(div);
                    });
                }

                suggestionsDiv.style.display = 'block';

            } catch (err) {
                console.error("Search Error:", err);
            }
        });

        // Click karke Data aur Images render karne ka Logic
        function renderResultCard(item, titleText) {
            suggestionsDiv.style.display = 'none';
            searchInput.value = titleText;

            carouselTrack.innerHTML = '';
            detailsGrid.innerHTML = '';

            let imagesFound = [];

            // MongoDB Document ke sabhi keys par iterate karke Information Boxes aur Images find karna
            for (const [key, value] of Object.entries(item)) {
                
                // Image field identify karna (URL, Array of URLs, etc.)
                if (key.toLowerCase().includes('image') || key.toLowerCase().includes('photo') || key.toLowerCase().includes('img')) {
                    if (Array.isArray(value)) {
                        imagesFound.push(...value);
                    } else if (typeof value === 'string') {
                        imagesFound.push(value);
                    }
                    continue;
                }

                // Normal Information Box add karna
                const box = document.createElement('div');
                box.className = 'info-box';
                
                // Lambe text/description ke liye full grid width dena
                if (typeof value === 'string' && value.length > 80) {
                    box.style.gridColumn = "1 / -1";
                }

                box.innerHTML = `
                    <div class="box-title">${key}</div>
                    <div class="box-value">${typeof value === 'object' ? JSON.stringify(value) : value}</div>
                `;
                detailsGrid.appendChild(box);
            }

            // Image Carousel Render
            if (imagesFound.length > 0) {
                imagesFound.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'carousel-image';
                    carouselTrack.appendChild(img);
                });
                carouselContainer.style.display = 'block';
            } else {
                carouselContainer.style.display = 'none';
            }

            resultCard.style.display = 'block';
        }

        // Side-Scroll Carousel Controls
        function scrollCarousel(direction) {
            const imageWidth = carouselTrack.clientWidth;
            carouselTrack.scrollBy({ left: direction * imageWidth, behavior: 'smooth' });
        }

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
                suggestionsDiv.style.display = 'none';
            }
        });
    </script>

</body>
</html>
