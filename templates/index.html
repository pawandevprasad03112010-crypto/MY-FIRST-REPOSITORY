<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Pull-In Login Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Container for the character and card sliding together */
    .delivery-wrapper {
      position: absolute;
      left: 100%; /* Start completely off-screen to the right */
      display: flex;
      align-items: center;
      transition: left 1.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Active state to move everything to middle */
    .delivery-wrapper.in-place {
      left: 50%;
      transform: translateX(-50%);
    }

    /* Character Design (CSS Animated Man) */
    .man-character {
      position: relative;
      width: 80px;
      height: 180px;
      margin-right: -10px; /* Touching the login box */
      z-index: 2;
    }

    /* Head */
    .head {
      width: 45px;
      height: 45px;
      background: #fcd34d;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 15px;
      border: 3px solid #78350f;
    }

    .hair {
      width: 50px;
      height: 18px;
      background: #451a03;
      border-radius: 15px 15px 0 0;
      position: absolute;
      top: -2px;
      left: -2px;
    }

    /* Body/Shirt */
    .torso {
      width: 40px;
      height: 60px;
      background: #2563eb;
      border-radius: 8px;
      position: absolute;
      top: 55px;
      left: 18px;
    }

    /* Arms pushing/pulling position */
    .arm {
      width: 35px;
      height: 10px;
      background: #fcd34d;
      position: absolute;
      top: 65px;
      border-radius: 5px;
      border: 2px solid #78350f;
    }

    .arm-left {
      left: -15px;
      transform: rotate(-15deg);
    }

    .arm-right {
      left: -10px;
      top: 80px;
      transform: rotate(10deg);
    }

    /* Legs */
    .leg {
      width: 14px;
      height: 55px;
      background: #1e3a8a;
      position: absolute;
      top: 115px;
      border-radius: 4px;
    }

    .leg-left { left: 20px; }
    .leg-right { left: 40px; }

    /* Walking animation while pulling */
    .delivery-wrapper.moving .leg-left {
      animation: walk 0.3s infinite alternate;
    }
    .delivery-wrapper.moving .leg-right {
      animation: walk 0.3s infinite alternate-reverse;
    }

    @keyframes walk {
      0% { transform: translateY(0) rotate(-10deg); }
      100% { transform: translateY(-5px) rotate(15deg); }
    }

    /* Login Card UI */
    .login-card {
      width: 340px;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    }

    .login-card h2 {
      color: #0f172a;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    /* Re-trigger Button at top right */
    .replay-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .replay-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <button class="replay-btn" onclick="bringLoginCard()">Animation Phir Se Dekho</button>

  <div class="delivery-wrapper" id="deliveryWrapper">
    <!-- CSS Animated Man -->
    <div class="man-character">
      <div class="head"><div class="hair"></div></div>
      <div class="torso"></div>
      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>
      <div class="leg leg-left"></div>
      <div class="leg leg-right"></div>
    </div>

    <!-- Login Box -->
    <div class="login-card">
      <h2>Welcome Back</h2>
      <form onsubmit="event.preventDefault(); alert('Login Attempted!');">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Apna email darj karein" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    function bringLoginCard() {
      const wrapper = document.getElementById('deliveryWrapper');
      
      // Reset position to right side
      wrapper.classList.remove('in-place', 'moving');
      
      // Small delay then trigger animation
      setTimeout(() => {
        wrapper.classList.add('moving');
        wrapper.classList.add('in-place');
        
        // Stop leg animation when reached center
        setTimeout(() => {
          wrapper.classList.remove('moving');
        }, 1800);
      }, 100);
    }

    // Page load hone par animation run karein
    window.addEventListener('DOMContentLoaded', bringLoginCard);
  </script>
</body>
</html>
