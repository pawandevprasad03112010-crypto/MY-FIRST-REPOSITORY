<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Web Scraper</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; font-size: 16px; background: #007BFF; color: white; border: none; cursor: pointer; width: 100%; }
        .result-box { background: white; padding: 15px; margin-top: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; }
        .copy-btn { background: #28a745; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Property & Location Search</h2>
    <form method="POST">
        <input type="text" name="query" value="{{ query }}" placeholder="Jaise: buy property in powai" required>
        <button type="submit">Search & Scrape</button>
    </form>

    {% if results %}
    <div class="result-box">
        <h3>Results (One-Click Copy):</h3>
        <button class="copy-btn" onclick="copyText()">Copy All Data</button>
        <pre id="dataToCopy">{% for r in results %}{{ loop.index }}. {{ r }}
{% endfor %}</pre>
    </div>
    <script>
        function copyText() {
            let text = document.getElementById("dataToCopy").innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Saara data clipboard par copy ho gaya!");
            });
        }
    </script>
    {% endif %}

</body>
</html>
