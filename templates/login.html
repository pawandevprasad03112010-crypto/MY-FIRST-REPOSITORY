<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Royal Search Portal</title>
    <style>
        :root {
            --bg-purple: #1a0933;
            --card-purple: #2b1254;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --silver-light: #e6e6e6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-purple), #0f0420);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--silver-light);
        }

        .login-card {
            background: rgba(43, 18, 84, 0.75);
            backdrop-filter: blur(10px);
            border: 2px solid var(--gold);
            box-shadow: 0 8px 32px 0 rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 40px;
            width: 350px;
            text-align: center;
        }

        h2 {
            color: var(--gold);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--silver);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: rgba(15, 4, 32, 0.6);
            border: 1px solid var(--silver);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 8px var(--gold);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--gold), #d4af37);
            border: none;
            border-radius: 8px;
            color: var(--bg-purple);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            box-shadow: 0 0 15px var(--gold);
            transform: translateY(-2px);
        }

        .error {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Royal Search Portal</h2>
        
        <form action="/login" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter username">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn-login">LOG IN</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>

</body>
</html>
